on:
  push:
    branches:
    - '**'
    - '!develop'
    - '!master'
    paths:
    - repos/fdbt-reference-data-service/**
  workflow_dispatch:

name: 'fdbt-reference-data-service'

defaults:
  run:
    working-directory: ./repos/fdbt-reference-data-service

jobs:

  fdbt-reference-data-service:
    name: 'fdbt-reference-data-service'
    runs-on: ubuntu-latest
    env:
      WORKSPACE: none
    
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3

    - name: Set up Python 3.10
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
      with:
        python-version: 3.10.12
      
    - name: audit-reference-data-retrievers
      run: |
        pip install safety==3.7.0
        cd src/retrievers
        safety check -r requirements.txt --policy-file ${{ github.workspace }}/.safety-policy.yml

    - name: Use Node.js 
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # 6.4.0
      with:
        node-version: 18.x

    - name: audit-reference-data-uploaders
      run: |
        pip install safety==3.7.0
        cd src/uploaders
        safety check -r requirements.txt --policy-file ${{ github.workspace }}/.safety-policy.yml
        safety check -r requirements.test.txt --policy-file ${{ github.workspace }}/.safety-policy.yml
    
    - name: test-reference-data-uploaders
      run: |
        cd src/uploaders
        pip install -r requirements.test.txt
        echo "Running tests..."
        python3 -m pytest tests/

    


    
    
