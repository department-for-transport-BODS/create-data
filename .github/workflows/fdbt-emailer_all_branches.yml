on:
  push:
    branches:
    - '**'
    - '!develop'
    - '!master'
    paths:
    - repos/fdbt-emailer/**
  workflow_dispatch:

name: 'fdbt-emailer-check'

defaults:
  run:
    working-directory: ./repos/fdbt-emailer

jobs:

  check_code:
    runs-on: ubuntu-latest
    env:
      WORKSPACE: test

    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3

    - name: Use Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # 6.4.0
      with:
        node-version: 24.x

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Test
      run: npm run test:ci

    - name: Build
      run: npm run build-all-functions-${{ env.WORKSPACE }}
