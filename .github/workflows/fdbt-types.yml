on:
  push:
    branches:
    - '**'
    paths:
    - repos/fdbt-types/**
  workflow_dispatch:

name: 'fdbt-types'

defaults:
  run:
    working-directory: ./repos/fdbt-types

jobs:

  fdbt-types_to_deploy:
    name: 'fdbt-types'
    runs-on: ubuntu-latest
    env:
      WORKSPACE: none
    
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
