AWSTemplateFormatVersion: 2010-09-09
Description: CloudFormation template for Cognito resources

Parameters:
  Stage:
    Type: String
    AllowedValues:
      - test
      - preprod
      - prod
  RegistrationLink:
    Type: String
  SESSourceArn:
    Type: String
  ForgottenPasswordLink:
    Type: String

Conditions:
  IsProd: !Equals [!Ref Stage, "prod"]

Resources:
  CognitoEmailTriggerLambda:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket: cfd-cognito-custom-triggers
        S3Key: email-trigger/v6/customEmailTrigger.zip
      Description: Lambda to send custom emails on user creation and forgotten password
      Environment:
        Variables:
          REGISTRATION_LINK: !Ref RegistrationLink
          FORGOTTEN_PASSWORD_LINK: !Ref ForgottenPasswordLink
      FunctionName: !Sub cognito-email-trigger-${Stage}
      Handler: custom_email_trigger.handler
      Role:
        Fn::ImportValue: !Sub ${Stage}:CognitoCustomTriggersLambdaRoleArn
      Runtime: python3.14

  CognitoEmailTriggerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/cognito-email-trigger-${Stage}
      RetentionInDays: 180

  CognitoTriggerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CognitoEmailTriggerLambda.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPool}

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub fdbt-user-pool-${Stage}
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
        - Name: noc
          AttributeDataType: String
          StringAttributeConstraints:
            MaxLength: "256"
            MinLength: "1"
          Mutable: true
        - Name: contactable
          AttributeDataType: String
          StringAttributeConstraints:
            MaxLength: "3"
            MinLength: "2"
          Mutable: true
        - Name: schemeOperator
          AttributeDataType: String
          StringAttributeConstraints:
            MaxLength: "256"
            MinLength: "1"
          Mutable: true
        - Name: schemeRegionCode
          AttributeDataType: String
          StringAttributeConstraints:
            MaxLength: "2"
            MinLength: "1"
          Mutable: true
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          TemporaryPasswordValidityDays: 3
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      EmailConfiguration:
        EmailSendingAccount: "COGNITO_DEFAULT"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      LambdaConfig:
        CustomMessage: !GetAtt CognitoEmailTriggerLambda.Arn
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool
      Description: Members can access the create-data admin utilities (manage users, resend invites, view reporting)

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      AccessTokenValidity: 20
      IdTokenValidity: 20
      RefreshTokenValidity: 1
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days
      ClientName: !Sub fdbt-site-client-${Stage}
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: true
      ReadAttributes:
        - email
        - email_verified
        - custom:noc
        - custom:schemeOperator
        - custom:schemeRegionCode
      WriteAttributes:
        - email
        - custom:noc
        - custom:contactable
        - custom:schemeOperator
        - custom:schemeRegionCode
      PreventUserExistenceErrors: ENABLED

Outputs:
  UserPoolClientID:
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub ${Stage}:UserPoolClientID
  UserPoolID:
    Value: !Ref UserPool
    Export:
      Name: !Sub ${Stage}:UserPoolID
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub ${Stage}:UserPoolArn
