[tools]
node = "24"
awscli-local = { version = "0.22.2", extras = "ver1" }
localstack = "4"

[env]
PROJECT_NAME = "fdbt"
UNVALIDATED_NETEX_BUCKET = "fdbt-unvalidated-netex-data-dev"

[vars]
product_types = """
single \
singleGroup \
periodMultiService \
schoolPeriodMultiService \
flatFare \
flatFareWithSopPrices \
flatFareGroup \
periodGeoZone \
periodGeoZoneGroup \
return \
returnCircular \
returnCircularGroup \
multiOpGeoZone \
multiOpMultiServices \
multiOpFlatFareGeoZone \
multiOpFlatFareMultiServices \
schemeOperatorGeoZone \
schemeOperatorFlatFare \
carnetSingle \
carnetReturn \
cappedReturn \
cappedFlatFare \
cappedSingle \
carnetPeriodGeoZone \
schemeCarnetPeriod \
carnetPeriodMultiService \
carnetFlatFare \
schemeCarnetFlatFare \
hybridPeriod \
periodPointToPoint \
flatFareGeoZone \
flatFareReturn \
flatFareWithExemptServices \
flatFareWithExemptStops \
schemeOperatorMultiServices \
schemeCarnetMultipleServices \
singleGroupMultipleAdults
"""

[tasks.dev]
description = "Bring up the full local environment and start the site"
run = [
    "mise run docker-up",
    "mise run wait-for-mysql",
    "mise run data-reset",
    "mise run wait-for-s3-and-sns",
    "mise run create-local-buckets",
    "mise run create-local-dynamodb-table",
    "mise run create-sns-topics",
    "mise run add-data-to-buckets",
    "mise run print-help",
    "mise run start-site",
]

# DOCKER

[tasks.docker-up]
description = "Bring up the docker containers"
run = "docker-compose up -d"

[tasks.docker-down]
description = "Remove the docker containers"
run = "docker-compose down"

[tasks.docker-restart]
description = "Restart the docker containers"
run = "docker-compose restart"

[tasks.delete-all]
description = "Delete all fdbt containers and images"
run = [
    "mise run delete-containers",
    "mise run delete-images",
]

[tasks.delete-containers]
description = "Delete all fdbt containers"
run = 'docker rm -f $(docker ps --filter name=${PROJECT_NAME} -aq)'

[tasks.delete-images]
description = "Delete all fdbt images"
run = 'docker rmi -f $(docker images ${PROJECT_NAME}* -qa)'

# SITE

[tasks.start-site]
description = "Run the site locally"
run = '''
    cd ../repos/fdbt-site
    export STAGE=dev
    npm run dev
'''

# NETEX CONVERTOR

[tasks.generate]
description = "Generate netex for a fare type, e.g. mise run generate single"
usage = '''
arg "<type>" help="Type of product" {
  choices {{vars.product_types}}
}
'''
run = "./scripts/trigger_netex_convertor.sh {{ usage.type }}"

[tasks.generate-validate]
description = "Generate and validate netex for a fare type, e.g. mise run generate-validate single"
usage = '''
arg "<type>" help="Type of product" {
  choices {{vars.product_types}}
}
'''
run = [
    "./scripts/trigger_netex_convertor.sh {{ usage.type }}",
    "./scripts/validate_latest_netex.sh",
]

[tasks.validate-netex]
description = "Validate a netex file: mise run validate-netex <file>"
usage = '''
arg "<file>" help="Path to the netex file"
'''
run = "./scripts/trigger_netex_validator.sh {{ usage.file }}"

[tasks.validate-latest-file]
description = "Validate the latest generated netex file"
run = "./scripts/validate_latest_netex.sh"

[tasks.validate-this-netex]
description = "Validate a specific netex file: mise run validate-this-netex <path-to-file>"
run = "./scripts/validate_this_netex.sh"

[tasks.copy-latest-netex]
description = "Copy the latest unvalidated netex file to the current directory"
run = '''
    awslocal s3 cp "s3://fdbt-unvalidated-netex-data-dev/$(awslocal s3 ls s3://fdbt-unvalidated-netex-data-dev --recursive | sort | tail -n 1 | awk '{print $NF}')" .
'''

[tasks.generate-validate-all]
depends = ["add-data-to-buckets"]
run = "./scripts/generate_validate_all_netex.sh"

[tasks.generate-validate-all-parallel]
depends = ["add-data-to-buckets"]
run = "./scripts/generate_validate_all_netex_parallel.sh"

[tasks.generate-validate-all-parallel-quiet]
depends = ["add-data-to-buckets"]
run = '''
./scripts/generate_validate_all_netex_parallel.sh | grep -E "Uploading file|valid schema|ERROR"
'''

[tasks.generate-netex-emailer]
description = "Trigger the netex emailer: mise run generate-netex-emailer <file>"
run = "./scripts/trigger_netex_emailer.sh"

# DATA

[tasks.data-reset]
description = "Reset the local database data"
run = [
    "./scripts/create_mysql_tables.sh",
    "./scripts/data_reset.sh",
]

# UTILITY

[tasks.wait-for-s3-and-sns]
run = "./scripts/wait_for_s3_sns.sh"

[tasks.wait-for-mysql]
run = "./scripts/wait_for_mysql.sh"

[tasks.create-local-buckets]
run = [
    "awslocal s3 mb s3://fdbt-raw-user-data-dev || true",
    "awslocal s3 mb s3://fdbt-user-data-dev || true",
    "awslocal s3 mb s3://fdbt-matching-data-dev || true",
    "awslocal s3 mb s3://fdbt-netex-data-dev || true",
    "awslocal s3 mb s3://fdbt-unvalidated-netex-data-dev || true",
    "awslocal s3 mb s3://fdbt-products-data-dev || true",
]

[tasks.create-local-dynamodb-table]
run = [
    "awslocal dynamodb create-table --attribute-definitions AttributeName=id,AttributeType=S --table-name sessions --key-schema AttributeName=id,KeyType=HASH --billing-mode PAY_PER_REQUEST || true",
    'awslocal dynamodb update-time-to-live --table-name sessions --time-to-live-specification "Enabled=true, AttributeName=expires"',
]

[tasks.create-sns-topics]
run = "awslocal sns create-topic --name AlertsTopic || true"

[tasks.add-data-to-buckets]
run = [
    "awslocal s3 sync ./data/matchingData/ s3://fdbt-matching-data-dev/BLAC",
    "awslocal s3 sync ./data/netexData/ s3://fdbt-netex-data-dev/BLAC",
    "awslocal s3 sync ./data/productsData/ s3://fdbt-products-data-dev/BLAC",
]

[tasks.print-help]
run = '''
    echo ""
    echo "**************************"
    echo "Site running on http://localhost:5555"
    echo "S3 running on http://localhost:4572"
    echo "MySQL running on 127.0.0.1:3306"
    echo "**************************"
'''

# CYPRESS

[tasks."cypress:open"]
run = """
cd ../repos/fdbt-site/cypress_tests
npm run openCypress
"""

[tasks."cypress:run:chrome"]
env = { BROWSER = "chrome" }
run = """
cd ../repos/fdbt-site/cypress_tests
npm run runCypress
"""

[tasks."cypress:run:chromium"]
env = { BROWSER = "chromium" }
run = """
cd ../repos/fdbt-site/cypress_tests
npm run runCypress
"""

[tasks."cypress:run:edge"]
env = { BROWSER = "edge" }
run = """
cd ../repos/fdbt-site/cypress_tests
npm run runCypress
"""
